<style>
  /* Moonlight GB: night slate, dim chalk, teal chalk, bright chalk. */
  :root {
    --slate: #0f052d; --dim: #203671; --teal: #36868f; --chalk: #5fc75d;
    --head: 'Cabin Sketch', 'Comic Sans MS', cursive; --hand: 'Schoolbell', 'Comic Sans MS', cursive; --mono: 'Share Tech Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--slate); color: var(--chalk); }
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 17px/1.35 var(--hand);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(ellipse at 20% 10%, #20367133, transparent 50%),
      radial-gradient(ellipse at 85% 70%, #20367126, transparent 55%), var(--slate);
    background-attachment: fixed;
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 2px 0 6px; }
  h1 { font: 700 34px/1 var(--head); margin: 0; letter-spacing: .5px; text-shadow: 0 0 1px var(--chalk); }
  header p { margin: 0; font: 14px var(--mono); color: var(--teal); text-transform: uppercase; letter-spacing: 1px; }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } h1 { font-size: 28px; } .hud { grid-template-columns: 1fr; } .counts { justify-content: flex-start; } }
  main { min-width: 0; }

  /* Telemetry strip above the board: the goal (hunger) and the counts. */
  .hud { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; margin-bottom: 6px; }
  .meter { position: relative; height: 26px; border: 2px solid var(--teal); border-radius: 13px 4px 13px 4px / 4px 13px 4px 13px; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(115deg, #36868fcc 0 6px, #203671cc 6px 11px); box-shadow: inset -3px 0 0 var(--chalk); transition: width .4s; }
  .meter span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font: 15px var(--mono); color: var(--chalk); text-shadow: 0 0 3px var(--slate), 0 0 3px var(--slate), 0 0 2px var(--slate); }
  .counts { display: flex; gap: 14px; font: 16px var(--mono); white-space: nowrap; }
  .counts b { font: 700 24px/1 var(--head); color: var(--chalk); }
  .counts small { color: var(--teal); font-size: 13px; }
  .sub { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; font: 13px var(--mono); color: var(--teal); min-height: 18px; }
  .sub .hot { color: var(--chalk); }
  #tuck { grid-column: 1 / -1; font: 700 20px var(--head); color: var(--slate); background: var(--chalk); border: 0; border-radius: 14px 4px 14px 4px; padding: 6px 12px; cursor: pointer; animation: pulse 1.6s ease-in-out infinite; }
  #tuck:focus-visible { outline: 2px dashed var(--chalk); outline-offset: 3px; }

  .boardwrap { position: relative; display: flex; justify-content: center; }
  canvas#board { display: block; touch-action: none; cursor: crosshair; border-radius: 10px; box-shadow: 0 0 0 3px #203671, 0 0 0 7px #0f052d, 0 0 0 9px #36868f55; }
  .log { margin: 10px 2px 0; min-height: 2.7em; font: 17px/1.35 var(--hand); color: var(--chalk); }
  .log b { font: 13px var(--mono); color: var(--teal); letter-spacing: 1px; margin-right: 4px; }
  .log.fresh { animation: chalkin .5s ease-out; }
  @keyframes chalkin { from { opacity: 0; filter: blur(2px); } }

  /* The column: sticky, never taller than the window. */
  aside { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; scrollbar-width: thin; padding: 2px 3px 6px; }
  @media (max-width: 760px) { aside { position: static; max-height: none; overflow: visible; } }
  aside h2 { font: 700 26px/1 var(--head); margin: 4px 0 8px; }
  #afford { font: 14px var(--mono); color: var(--teal); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 0 0 10px; }
  .actions:not(:has(> :not([hidden]))) { display: none; }
  .act { position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left; font: 700 19px/1.05 var(--head); color: var(--slate); background: var(--chalk); border: 0; border-radius: 14px 4px 12px 4px / 4px 12px 4px 14px; padding: 6px 10px 5px; cursor: pointer; }
  .act.brine { background: var(--teal); color: var(--slate); }
  .act small { font: 13px var(--mono); }
  .act[aria-disabled="true"] { opacity: .45; cursor: default; }
  .act:focus-visible { outline: 2px dashed var(--chalk); outline-offset: 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs button { flex: 1; position: relative; font: 700 17px var(--head); color: var(--teal); background: none; border: 2px solid var(--dim); border-radius: 12px 3px 12px 3px; padding: 3px 6px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--chalk); border-color: var(--chalk); }
  .tabs button small { font: 12px var(--mono); }
  .tabs button.fresh::after { content: ""; position: absolute; top: 4px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--chalk); }
  .tabs button:focus-visible { outline: 2px dashed var(--chalk); outline-offset: 2px; }
  #shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  @media (max-width: 760px) and (min-width: 520px) { #shop { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .up {
    position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; font: 15px/1.2 var(--hand); color: var(--teal);
    background: #20367155; border: 2px solid var(--dim); border-radius: 12px 3px 11px 4px / 4px 11px 3px 12px; padding: 4px 9px 5px; cursor: pointer;
  }
  .up b { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--chalk); }
  .up em { font: 13px var(--mono); font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up.can { border-color: var(--chalk); background: #36868f33; }
  .up.can em { color: var(--chalk); }
  .up[aria-disabled="true"] { cursor: default; }
  .up[aria-disabled="true"]:not(.can) b { opacity: .7; }
  .up.odd { border-style: dashed; }
  .up .tag { position: absolute; top: -9px; right: 6px; font: 12px var(--mono); font-style: normal; color: var(--slate); background: var(--chalk); padding: 0 5px; border-radius: 6px 2px 6px 2px; transform: rotate(5deg); }
  .up.new { animation: pulse 1.6s ease-in-out 4; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 3px #5fc75d66; } }
  .up:focus-visible, .bought:focus-visible { outline: 2px dashed var(--chalk); outline-offset: 2px; }
  #tip {
    position: fixed; z-index: 50; width: 240px; padding: 9px 12px 10px; pointer-events: none; font: 15px/1.3 var(--hand); color: var(--chalk);
    background: var(--slate); border: 2px solid var(--chalk); border-radius: 14px 4px 14px 4px / 4px 14px 4px 14px; box-shadow: 0 0 0 4px #0f052dcc, 0 6px 20px #000a;
  }
  #tip b { display: block; font: 700 21px/1.05 var(--head); margin-bottom: 3px; }
  #tip i { display: block; margin-top: 6px; font-style: normal; font-size: 14px; color: var(--teal); border-top: 2px dashed var(--dim); padding-top: 5px; }
  #tip small { display: block; margin-top: 6px; font: 12px var(--mono); color: var(--teal); }
  #tip.inline { position: static; width: auto; margin-top: 10px; box-shadow: none; }
  #bought { margin: 12px 0 2px; }
  #bought summary { display: flex; align-items: center; gap: 6px; font: 700 20px/1 var(--head); color: var(--teal); cursor: pointer; list-style: none; padding: 3px 4px; }
  #bought summary::-webkit-details-marker { display: none; }
  #bought summary::before { content: "\25B8"; font-size: 14px; color: var(--chalk); transition: transform .2s; }
  #bought[open] summary::before { transform: rotate(90deg); }
  #bought summary:focus-visible { outline: 2px dashed var(--chalk); outline-offset: 2px; }
  .shelf { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 2px 2px; }
  .bought { max-width: 100%; font: 14px/1.2 var(--hand); color: var(--teal); background: none; border: 1.5px solid var(--dim); border-radius: 10px 3px 9px 3px; padding: 2px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bought.odd { border-style: dashed; }
  .bought:hover, .bought.on { color: var(--chalk); border-color: var(--chalk); }

  #ending { margin: 18px auto 0; max-width: 640px; text-align: center; padding: 16px 18px 20px; border: 2px dashed var(--teal); border-radius: 18px 5px 18px 5px; }
  #ending h2 { font: 700 34px/1.05 var(--head); margin: 0 0 6px; }
  #ending p { margin: 6px 0; }
  #ending .hint { font: 14px var(--mono); color: var(--teal); }
  #shareBtn, #againBtn { font: 700 20px var(--head); color: var(--slate); background: var(--chalk); border: 0; border-radius: 14px 4px 14px 4px; padding: 7px 16px; margin: 10px 4px 0; cursor: pointer; }
  #againBtn { background: none; color: var(--chalk); border: 2px solid var(--chalk); }
  #shareBtn:focus-visible, #againBtn:focus-visible { outline: 2px dashed var(--chalk); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .up.new, #tuck, .log.fresh { animation: none; } .meter i, #bought summary::before { transition: none; } }
</style>

<body>
<div class="wrap">
  <header>
    <h1>We Have a Pickle</h1>
    <p>Solar Mission Control · Halloween night</p>
  </header>
  <div class="game">
    <main>
      <div class="hud">
        <div class="meter" id="meter" title="How full the Sun is"><i id="meterFill"></i><span><em id="hungerName">Peckish</em><em id="hungerPct">0%</em></span></div>
        <div class="counts"><span><b id="pickles">0</b> <small>pickles</small></span><span id="jarBox" hidden><b id="jars">0</b> <small>jars</small></span></div>
        <div class="sub" id="sub"></div>
        <button id="tuck" type="button" class="tipped" hidden>Tuck the Sun in</button>
      </div>
      <div class="boardwrap"><canvas id="board" aria-label="The plotting board: draw a chalk line from the Sun through the pickles"></canvas></div>
      <p class="log" id="log" aria-live="polite"></p>
    </main>
    <aside id="side">
      <div class="actions">
        <button id="eatBtn" type="button" class="act tipped" hidden>Eat half <small id="eatN"></small></button>
        <button id="brineBtn" type="button" class="act brine tipped" hidden>Brine half <small id="brineN"></small></button>
      </div>
      <h2 hidden>Hardware <span id="afford"></span></h2>
      <div class="tabs" id="tabs" role="tablist" hidden></div>
      <div id="shop" role="tabpanel"></div>
      <details id="bought" hidden><summary>Bought · <span id="boughtN">0</span></summary><div class="shelf" id="shelf"></div></details>

    </aside>
  </div>
  <section id="ending" hidden>
    <h2 id="endTitle">Recovery complete.</h2>

    <button id="shareBtn" type="button">Share result</button>
  </section>
</div>
<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import { grain } from '/shared/kit/fx.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const fmt = E.fmt;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { slate: '#0f052d', dim: '#203671', teal: '#36868f', chalk: '#5fc75d' };

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:9:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound ----------
const A = createAudio({ sfxTrim: 2, musicTrim: 7.5 });
const notes = scale('minor', 57); // A minor from A3, like the music
let lastScratch = 0;
const sfx = {
  scratch() { const t = A.now; if (t - lastScratch < 0.07) return; lastScratch = t; A.noiseHit('hat', { vol: 0.077, dur: 0.03 }); },
  catch(i = 0) { A.tone({ type: 'pulse', freq: notes(7 + Math.min(i, 9)), dur: 0.05, vol: 0.24, cutoff: 3200, at: A.now + 0.002 }); },
  home() { A.tone({ type: 'triangle', freq: notes(7), dur: 0.1, vol: 0.224 }); A.tone({ type: 'pulse', freq: notes(11), dur: 0.08, vol: 0.072, cutoff: 3000, at: A.now + 0.06 }); },
  cut() { A.tone({ type: 'square', freq: notes(2), dur: 0.16, vol: 0.168, glide: 0.5, cutoff: 1400 }); A.noiseHit('snare', { vol: 0.168 }); },
  fizzle() { A.tone({ type: 'triangle', freq: notes(4), dur: 0.18, vol: 0.25, glide: 0.7 }); },
  eat() {
    A.noiseHit('kick', { vol: 0.113 });
    A.tone({ type: 'triangle', freq: notes(0), dur: 0.12, vol: 0.144, glide: 0.6 });
    A.noiseHit('kick', { vol: 0.09, at: A.now + 0.14 });
    [0, 2, 4, 7].forEach((d, i) => A.tone({ type: 'pulse', freq: notes(d + 7), dur: 0.07, vol: 0.036, cutoff: 3000, at: A.now + 0.28 + i * 0.06 }));
  },
  brine() { [9, 7, 11, 8, 12].forEach((d, i) => A.tone({ type: 'sine', freq: notes(d), dur: 0.06, vol: 0.22, glide: 1.5, at: A.now + i * 0.07 })); },
  buy() { [0, 2, 4, 7].forEach((d, i) => A.tone({ type: 'pulse', freq: notes(d + 7), dur: 0.06, vol: 0.209, cutoff: 3200, at: A.now + i * 0.055 })); },
  unlock() { A.tone({ type: 'bell', freq: notes(9), dur: 0.4, vol: 0.16 }); A.tone({ type: 'bell', freq: notes(11), dur: 0.5, vol: 0.13, at: A.now + 0.12 }); },
  streak() { [4, 7, 9, 11].forEach((d, i) => A.tone({ type: 'pulse', freq: notes(d + 7), dur: 0.05, vol: 0.25, cutoff: 3200, at: A.now + i * 0.045 })); },
  deny() { A.tone({ type: 'triangle', freq: notes(-3), dur: 0.08, vol: 0.234 }); },
  neighbor() { [4, 3, 2, 0].forEach((d, i) => A.tone({ type: 'triangle', freq: notes(d), dur: 0.14, vol: 0.12, at: A.now + i * 0.13 })); },
  // The obvious ending: a music-box lullaby, falling asleep.
  finale() {
    [7, 4, 2, 4, 0, -1, 0, -3].forEach((d, i) => A.tone({ type: 'bell', freq: notes(d + 7), dur: 0.5, vol: 0.18, at: A.now + i * 0.32 }));
    A.tone({ type: 'pad', freq: notes(0), dur: 2.4, vol: 0.06, attack: 0.6, release: 1.4, cutoff: 900 });
  },
  // The secret ending: a trick-or-treat march.
  trick() {
    [0, 0, 2, 4, 2, 4, 5, 7].forEach((d, i) => A.tone({ type: 'pulse', freq: notes(d + 7), dur: 0.12, vol: 0.079, cutoff: 3000, at: A.now + i * 0.17 }));
    [0, 4, 0, 4].forEach((d, i) => A.tone({ type: 'triangle', freq: notes(d - 7), dur: 0.2, vol: 0.198, at: A.now + i * 0.34 }));
    A.tone({ type: 'bell', freq: notes(14), dur: 0.8, vol: 0.092, at: A.now + 1.4 });
  },
};
if (location.search.includes('debug')) window.__game = { A, sfx, long: ['finale', 'trick'], pos: id => planetPos(E.PLANETS.find(p => p.id === id)), S: () => S };

// The game owns playback; music.mjs arranges the score per phase.
let music = null, soundtrack = null;
const musicKey = () => E.phase(S);
function song() { return (soundtrack ??= createSoundtrack(music.strudel))(musicKey()); }
createMusic(A, { song }).then(m => { music = m; music.update(); }).catch(e => console.warn('music', e));

// ---------- Chalk art ----------
// Everything is drawn in chalk once, up front, with a seeded wobble so it holds still.
let seed = 9;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
function chalk(ctx, path, { color = C.chalk, width = 3, passes = 3, jitter = 1, alpha = 0.6, fill = null } = {}) {
  if (fill) { ctx.save(); ctx.globalAlpha = fill.alpha ?? 0.25; ctx.fillStyle = fill.color; ctx.beginPath(); path(ctx); ctx.fill(); ctx.restore(); }
  for (let p = 0; p < passes; p++) {
    ctx.save();
    ctx.translate(rr(-jitter, jitter), rr(-jitter, jitter));
    ctx.strokeStyle = color; ctx.globalAlpha = alpha * rr(0.7, 1.1);
    ctx.lineWidth = width * rr(0.7, 1.15); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash([rr(8, 18), rr(0.5, 2.5)]);
    ctx.beginPath(); path(ctx); ctx.stroke();
    ctx.restore();
  }
}
// Chalk grain: knock tiny holes out of whatever was drawn.
function dust(ctx, w, h, amount = 0.12) {
  ctx.save(); ctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < w * h * amount / 9; i++) { ctx.globalAlpha = rr(0.3, 0.9); ctx.fillRect(rr(0, w), rr(0, h), rr(0.6, 1.8), rr(0.6, 1.8)); }
  ctx.restore();
}
function hatch(ctx, cx, cy, r, color, gap = 7, alpha = 0.28) {
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  chalk(ctx, c => { for (let x = -r * 2; x < r * 2; x += gap) { c.moveTo(cx + x, cy - r); c.lineTo(cx + x + r * 0.9, cy + r); } }, { color, width: 1.6, passes: 1, alpha });
  ctx.restore();
}
const circle = (cx, cy, r) => c => c.arc(cx, cy, r, 0, Math.PI * 2);

// The Sun, 240 px: a round chalk face with wavy rays. mood: lazy | chomp | asleep | costume
function drawSun(mood) {
  const N = 240, c = Sprites.canvas(N, N), x = c.getContext('2d'), m = N / 2, R = 72;
  seed = 31 + mood.length;
  if (mood === 'costume') {
    // A Sun-sized pickle suit: a bumpy green capsule with the face peeking out.
    const path = q => { q.ellipse(m, m + 4, R * 0.95, R * 1.38, 0, 0, Math.PI * 2); };
    chalk(x, path, { width: 4, fill: { color: C.chalk, alpha: 0.18 } });
    for (let i = 0; i < 16; i++) { const a = rr(0, Math.PI * 2), d = rr(0.45, 0.9); chalk(x, circle(m + Math.cos(a) * R * 0.95 * d, m + 4 + Math.sin(a) * R * 1.38 * d, rr(2.5, 4)), { width: 2, passes: 2, color: C.teal }); }
    chalk(x, circle(m, m - 14, 34), { width: 3, color: C.chalk, fill: { color: C.slate, alpha: 1 } });
    chalk(x, q => { q.moveTo(m - 16, m - 18); q.quadraticCurveTo(m - 10, m - 13, m - 4, m - 18); q.moveTo(m + 4, m - 18); q.quadraticCurveTo(m + 10, m - 13, m + 16, m - 18); }, { width: 2.6 });
    chalk(x, q => { q.moveTo(m - 9, m - 2); q.quadraticCurveTo(m, m + 6, m + 9, m - 2); }, { width: 2.6 });
    dust(x, N, N, 0.1);
    return c;
  }
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * Math.PI * 2 + 0.1;
    chalk(x, q => {
      for (let s = 0; s <= 8; s++) {
        const rad = R + 10 + s * 3.3, wob = Math.sin(s * 1.4 + i) * 0.05;
        const px = m + Math.cos(a + wob) * rad, py = m + Math.sin(a + wob) * rad;
        s ? q.lineTo(px, py) : q.moveTo(px, py);
      }
    }, { width: 3.2, passes: 2 });
  }
  chalk(x, circle(m, m, R), { width: 4.5, fill: { color: C.chalk, alpha: 0.12 } });

    tip.style.top = `${r.top - t.height - 8 > 8 ? r.top - t.height - 8 : r.bottom + 8}px`;
  }
}
function hideTip(force) {
  const tip = $('tip');
  if (tip.classList.contains('inline') && force !== true) return;
  tip.hidden = true; tip.classList.remove('inline'); tipFor = null;
  for (const b of document.querySelectorAll('.bought.on')) b.classList.remove('on');
}
let tipMoved = 0;
addEventListener('scroll', () => { if (performance.now() - tipMoved > 400) hideTip(); }, true);
addEventListener('resize', () => { if (innerWidth > 760) hideTip(true); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.up, .tipped, .bought')) hideTip(); });

// Buttons whose effect isn't obvious from the label explain themselves (on touch, the first tap of the session).
const explained = new Set();
function actionTip(id) {
  const st = E.stats(S);
  if (id === 'eatBtn') {
    const after = Math.pow(1 + (S.eaten + Math.floor(S.p / 2)) / E.T.glowK, E.T.glowP);
    return { id, name: 'Eat half', desc: `The Sun eats half your pickles (${fmt(Math.floor(S.p / 2))}). It fills the hunger meter and the Sun glows brighter, lighting more of the dark: every pickle after counts ×${after.toFixed(2)} instead of ×${st.glow.toFixed(2)}. Everything else stays.`, foot: 'The meter only fills by eating.' };
  }
  if (id === 'brineBtn') return { id, name: 'Brine half', desc: `Packs half your pickles into jars, ${E.JAR} to a jar (${fmt(Math.floor(S.p / 2 / E.JAR))} now). Jars pay for hardware in the Jars tab.`, foot: 'Pickles in jars can\'t be eaten. They\'re for engineering.' };
  if (id === 'tuck') return { id, name: 'Tuck the Sun in', desc: 'Ends the night: the Sun, stuffed, goes to sleep. Mission accomplished.', foot: E.secretReady(S) ? 'Venus\'s porch light is still on, though.' : 'Ends the game.' };
}
for (const id of ['eatBtn', 'brineBtn', 'tuck']) {
  const b = $(id);
  b.setAttribute('aria-describedby', 'tip');
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTip(b, actionTip(id)); });
  b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
  b.addEventListener('focus', () => { if (!b.dataset.touch) showTip(b, actionTip(id)); });
  b.addEventListener('blur', hideTip);
  b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
  b.addEventListener('click', () => {
    if (b.dataset.touch && !explained.has(id)) { explained.add(id); showTip(b, actionTip(id)); return; }
    hideTip();
    if (id === 'eatBtn') doEat(); else if (id === 'brineBtn') doBrine(); else end('nap');
  });
}

// ---------- The Bought shelf ----------
const shelfEl = $('bought');
shelfEl.open = !!S.boughtOpen;
shelfEl.addEventListener('toggle', () => {
  if (!shelfEl.open) hideTip(true);
  if (!!S.boughtOpen === shelfEl.open) return;
  S.boughtOpen = shelfEl.open; save();
});
let shelfSig = null;
function renderShelf() {
  const list = S.ended ? [] : E.UPGRADES.filter(u => !u.max && S.odd[u.id]);
  const sig = list.map(i => i.id).join('|');
  if (sig === shelfSig) return;
  shelfSig = sig;
  shelfEl.hidden = !list.length;
  $('boughtN').textContent = list.length;
  $('shelf').replaceChildren(...list.map(it => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'bought' + (it.silly ? ' odd' : '');
    b.textContent = it.name; b.dataset.id = it.id;
    b.setAttribute('aria-describedby', 'tip');
    const show = () => { hideTip(true); b.classList.add('on'); showTip(b, { id: 'bought:' + it.id, name: it.name, desc: it.desc, joke: it.joke, foot: 'Bought', inline: true }); };
    b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(); });
    b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
    b.addEventListener('focus', () => { if (!b.dataset.touch) show(); });
    b.addEventListener('blur', hideTip);
    b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
    b.addEventListener('click', () => { if (tipFor === 'bought:' + it.id && b.dataset.touch) hideTip(true); else show(); });
    return b;
  }));
}

function doBuy(id) {
  const u = E.BY_ID[id];
  if (!E.buy(S, id)) { sfx.deny(); return; }
  delete newUntil[id];
  hideTip();
  sfx.buy();
  say(u.joke);
  if (id === 'mars' || id === 'moon') puff(500, 500, 6);
  save(); renderShop(); hud();
}

// ---------- The secret: the Sun goes trick-or-treating ----------
let trick = null, trickFreeze = 0;
function startTrick(pts) {
  trickFreeze = boardT;
  S.ending = 'trick';
  trick = { t: 0, a: 0 };
  end('trick');
}
// Everyone holds still while the Sun, in its pickle costume, goes round the neighbors door to door.
function updateTrick(dt) {
  trick.t += dt;
  trick.a = trick.t * 0.35;
}
function drawTrickSun() {
  const out = E.PLANETS;
  const n = out.length, seg = (trick.t * 0.25) % n, i = Math.floor(seg), f = seg - i;
  const stop = j => { const q = planetPos(out[j % n]); const ang = Math.atan2(q.y - 500, q.x - 500); return { x: q.x + Math.cos(ang) * 95, y: q.y + Math.sin(ang) * 95 }; };
  const a = stop(i), b = stop(i + 1);
  const e = f < 0.6 ? 0 : (f - 0.6) / 0.4, ease = e * e * (3 - 2 * e);
  const x = a.x + (b.x - a.x) * ease, y = a.y + (b.y - a.y) * ease - (reduced ? 0 : Math.abs(Math.sin(trick.t * 6)) * 8);
  // The empty spot in the middle where the Sun always was.
  ctx.save(); ctx.globalAlpha = 0.35; ctx.strokeStyle = C.teal; ctx.lineWidth = 3; ctx.setLineDash([6, 10]);
  ctx.beginPath(); ctx.arc(500, 500, 72, 0, Math.PI * 2); ctx.stroke();
  ctx.font = '24px Schoolbell, cursive'; ctx.fillStyle = C.teal; ctx.textAlign = 'center'; ctx.globalAlpha = 0.8; ctx.fillText('back soon', 500, 508); ctx.restore();
  ctx.drawImage(ART.costume, x - 95, y - 95, 190, 190);
  // A treat bag, getting fuller.
  ctx.save(); ctx.strokeStyle = C.chalk; ctx.lineWidth = 3; ctx.fillStyle = '#36868f66';
  ctx.beginPath(); ctx.moveTo(x + 52, y + 14); ctx.lineTo(x + 48, y + 54); ctx.lineTo(x + 86, y + 54); ctx.lineTo(x + 82, y + 14); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  if (f < 0.6) {
    const who = out[i % n];
    ctx.save(); ctx.font = '26px Schoolbell, cursive'; ctx.textAlign = 'center'; ctx.fillStyle = C.chalk;
    const q = planetPos(who);
    ctx.lineWidth = 6; ctx.strokeStyle = C.slate;
    const txt = TRICK_LINES[who.id];
    ctx.strokeText(txt, q.x, q.y - 60); ctx.fillText(txt, q.x, q.y - 60);
    ctx.restore();
  }
}
const TRICK_LINES = { mercury: '"A visitor? For ME?"', venus: '"Here you go, sugar. A pickle."', earth: '"Trick or tr- oh! It\'s warm out!"', mars: '"...Fine. Take two."' };

// ---------- Ending ----------
function end(kind, resumed = false) {
  S.ended = true; S.ending = kind || S.ending || 'nap'; save();
  const secret = S.ending === 'trick';
  if (secret && !trick) { trick = { t: 0, a: 0 }; trickFreeze = boardT; }
  pickles.length = 0; drawing = null; hideTip(true);
  $('ending').hidden = false;
  $('endTitle').textContent = secret ? 'The roles reverse.' : 'Recovery complete.';
  $('endText').textContent = secret
    ? 'For 4.6 billion years everyone went round the Sun. Tonight, just once, everyone held still and the Sun went round them: shoes on, pickle costume on, door to door. Mercury had never had a visitor. Mars gave it two. Venus gave it a pickle, of course.'
    : 'The Sun ate its fill, two million pickles and change, and fell asleep exactly where it has always been. Mission Control turned the lights down. Venus\'s porch light stayed on.';
  $('endHint').textContent = secret ? 'Secret ending found. MISSION CONTROL: Flight, the Sun has moved. Repeat: the Sun has moved.' : '1 of 2 endings. CAPCOM: The Sun kept looking at Venus\'s porch. Something about a costume, some shoes and an address.';
  if (resumed) setTimeout(() => $('ending').scrollIntoView({ behavior: 'auto', block: 'nearest' }), 300);
  if (!resumed) {
    (secret ? sfx.trick : sfx.finale)();
    if (window.DailyGame) {
      const m = Math.floor(S.t / 60), s = String(Math.floor(S.t % 60)).padStart(2, '0');
      DailyGame.finish({ lines: secret
        ? ['🎃 The Sun went trick-or-treating', `⏱ ${m}m${s}s`, `🥒 ${fmt(S.eaten)} pickles eaten`]
        : ['☀️ Tucked in', `⏱ ${m}m${s}s`, `🥒 ${fmt(S.eaten)} eaten`, `🔥 best streak ${S.bestStreak}`] });
    }
    setTimeout(() => $('ending').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }), 600);
  }
  if (music) music.update();
  hud(); renderShop();
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Loop ----------
let last = performance.now(), econLast = performance.now(), saveAcc = 0, probeAcc = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now;
  updateBoard(dt);
  render();
  requestAnimationFrame(frame);
}
// The economy ticks on a timer so probes keep fetching in a background tab.
setInterval(() => {
  const now = performance.now(), dt = Math.min(2, (now - econLast) / 1000); econLast = now;
  if (S.ended) return;
  const phaseWas = E.phase(S), venusWas = S.venusMet, outWas = E.planetsOut(S).length;
  E.tick(S, dt);
  const st = E.stats(S);
  if (st.autoEvery) { autoAcc += dt; if (autoAcc >= st.autoEvery) { autoAcc = 0; autopilot(); } }
  if (st.probes) { probeAcc += dt; if (probeAcc > 3) { probeAcc = 0; } }
  if (!S.venusMet && S.total >= 400) { S.venusMet = true; sfx.neighbor(); say('VENUS', 'Happy Halloween, hon! Pickle? ...No? Suit yourself.' + ' (She throws it into the dark. Of course she does.)'); }
  else if (E.planetsOut(S).length > outWas && E.phase(S) === phaseWas) sfx.neighbor();
  if (E.phase(S) !== phaseWas) phaseChange(phaseWas);
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
  hud(); renderShop(); ambient();
}, 250);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('resize', layout);

layout();
if (S.ended) { end(S.ending || 'nap', true); }
else {
  for (let i = 0; i < Math.min(E.stats(S).cap, 6 + S.strokes); i++) spawnPickle(false);
  if (!S.strokes) say('FLIGHT', 'Halloween night. The Sun is hungry and will not get up. Pickles adrift. Plot a trajectory: draw a line from the Sun through them.');
  else say('CAPCOM', 'Welcome back, Flight. The Sun has not moved. The pickles are still adrift.');
}
hud(); renderShop();
document.fonts?.ready.then(layout);
requestAnimationFrame(frame);
</script>
