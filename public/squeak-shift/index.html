<style>
  /* SLSO8: #0d2b45 #203c56 #544e68 #8d697a #d08159 #ffaa5e #ffd4a3 #ffecd6 */
  :root {
    --navy: #0d2b45; --deep: #203c56; --slate: #544e68; --mauve: #8d697a; --rust: #d08159; --orange: #ffaa5e; --peach: #ffd4a3; --cream: #ffecd6;
    --bg: var(--navy); --ink: var(--cream); --hand: 'Architects Daughter', 'Comic Sans MS', cursive; --mono: 'Share Tech Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--ink); }
  /* Keep this: any display rule (flex, grid) would otherwise override the hidden attribute. */
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 15px/1.45 var(--hand);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(14px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    /* Blueprint paper: a fine grid with a heavier line every fifth square. */
    background-image:
      linear-gradient(#ffecd60f 1px, transparent 1px), linear-gradient(90deg, #ffecd60f 1px, transparent 1px),
      linear-gradient(#ffecd606 1px, transparent 1px), linear-gradient(90deg, #ffecd606 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin: 2px 0 8px; }
  header h1 { font: 400 clamp(28px, 5vw, 40px)/1 var(--hand); margin: 0; color: var(--cream); letter-spacing: 1px; text-decoration: underline 2px var(--orange); text-underline-offset: 6px; }
  header p { margin: 0; color: var(--peach); font-size: 14px; }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } }
  /* A drafting panel: a thin cream rule with corner ticks. */
  .sheet { position: relative; border: 1.5px solid #ffecd677; border-radius: 3px; background: #0d2b45cc; }
  .sheet::before, .sheet::after { content: ""; position: absolute; width: 9px; height: 9px; border: 1.5px solid var(--orange); pointer-events: none; }
  .sheet::before { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
  .sheet::after { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }
  .stagebox { max-width: min(100%, calc(47vh * 640 / 400)); padding: 4px; }
  canvas#stage { display: block; width: 100%; height: auto; aspect-ratio: 640 / 400; touch-action: none; cursor: grab; }
  canvas#stage:focus-visible { outline: 2px dashed var(--orange); outline-offset: 3px; }
  .stats { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: 8px 2px 0; font: 15px var(--mono); color: var(--peach); }
  .stats b { color: var(--cream); font-weight: 400; }
  .stats .hush b { color: var(--orange); letter-spacing: 2px; }
  .meter { margin: 5px 2px 0; }
  .meter .label { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--peach); }
  .meter .label b { color: var(--cream); font-weight: 400; }
  .bar { position: relative; height: 10px; border: 1.5px solid #ffecd688; border-radius: 2px; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(135deg, var(--orange) 0 5px, #ffaa5e99 5px 8px); transition: width .4s; }
  /* Clipboard and staff, one tab at a time so the play area never runs below the fold. */
  .desk { margin: 8px 0 0; padding: 6px 10px 8px; }
  .desk .tabs { display: flex; gap: 6px; margin: 0 0 4px; }
  .desk .tabs button { font: 15px var(--hand); color: var(--peach); background: none; border: 0; border-bottom: 2px solid transparent; padding: 2px 6px; cursor: pointer; }
  .desk .tabs button[aria-selected="true"] { color: var(--cream); border-bottom-color: var(--orange); }
  .desk .tabs button.fresh::after { content: " •"; color: var(--orange); }
  .desk .tabs button:focus-visible { outline: 2px dashed var(--orange); }
  .desk .note { font-size: 13px; color: var(--peach); margin: 0 0 3px; }
  .row { display: grid; grid-template-columns: 50px 22px minmax(0, 1fr) auto minmax(78px, auto); align-items: center; gap: 6px; font-size: 14px; min-height: 27px; }
  .row.off { opacity: .55; }
  .row.noroom .name::after { content: " (no room)"; color: var(--rust); font-size: 12px; }
  .row .mv { display: flex; gap: 2px; }
  .mini { font: 13px/1 var(--mono); color: var(--cream); background: none; border: 1px solid #ffecd666; border-radius: 3px; width: 23px; height: 22px; padding: 0; cursor: pointer; }
  .mini:hover { border-color: var(--orange); color: var(--orange); }
  .mini:disabled { opacity: .3; cursor: default; }
  .mini:focus-visible { outline: 2px dashed var(--orange); outline-offset: 1px; }
  .row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--orange); margin: 0; cursor: pointer; }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .param { display: flex; align-items: center; gap: 3px; font: 12px var(--mono); color: var(--peach); white-space: nowrap; }
  .row .st { font: 12px var(--mono); color: var(--mauve); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .st.go { color: var(--orange); }
  @media (max-width: 560px) {
    .row { grid-template-columns: 50px 22px minmax(0, 1fr) auto; grid-template-areas: "mv cb name st" "mv cb param param"; row-gap: 2px; padding: 2px 0; }
    .row .mv { grid-area: mv; } .row input[type=checkbox] { grid-area: cb; } .row .name { grid-area: name; } .row .st { grid-area: st; } .row .param { grid-area: param; }
    .row .param:empty { display: none; }
  }
  .jobs .row { grid-template-columns: 22px minmax(0, 1fr) 82px; grid-template-areas: none; }
  .jobs .ct { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font: 14px var(--mono); }
  .jobs .ct b { min-width: 18px; text-align: center; font-weight: 400; color: var(--orange); }
  .jobs .what { font-size: 12px; color: var(--peach); }
  .log { margin: 8px 2px 0; min-height: 2.9em; font-size: 15px; color: var(--cream); }
  .log.fresh { animation: fresh 1s ease-out; }
  @keyframes fresh { from { color: var(--orange); } }
  /* The column stays in view and scrolls on its own, so nothing on it is ever below the fold. */
  aside { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain;
          padding: 8px 6px 6px; scrollbar-width: thin; scrollbar-color: var(--slate) transparent; }
  @media (max-width: 760px) { aside { position: static; max-height: none; overflow: visible; } }
  aside h2 { font: 400 21px var(--hand); margin: 2px 0 8px; color: var(--cream); }
  #afford { font: 13px var(--mono); color: var(--orange); }
  .actions { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }
  .actions:not(:has(.btn:not([hidden]))) { display: none; }
  .btn {
    font: 17px var(--hand); color: var(--navy); background: var(--orange); border: 0; border-radius: 3px; padding: 7px 12px;
    cursor: pointer; text-align: left; box-shadow: 0 0 0 1.5px var(--navy) inset, 3px 3px 0 #ffaa5e44;
  }
  .btn small { display: block; font: 12px var(--mono); color: var(--navy); }
  .btn[aria-disabled="true"] { background: transparent; color: var(--cream); box-shadow: inset 0 0 0 1.5px #ffecd677; cursor: default; }
  .btn[aria-disabled="true"] small { color: var(--peach); }
  .btn.ring { animation: ring 1.3s ease-in-out infinite; }
  @keyframes ring { 50% { box-shadow: 0 0 0 1.5px var(--navy) inset, 0 0 14px var(--orange); } }
  .btn:focus-visible { outline: 2px dashed var(--orange); outline-offset: 2px; }
  #shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  @media (max-width: 760px) and (min-width: 520px) { #shop { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* Two to a row, name over price. What it does is in the tooltip. */
  .up {
    position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; font: 14px/1.25 var(--hand); color: var(--cream);
    background: #0d2b45; border: 1.5px solid #ffecd655; border-radius: 3px; padding: 5px 9px; cursor: pointer;
  }
  .up b { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up em { font: normal 12px var(--mono); color: var(--peach); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up.can { border-color: var(--orange); background: #203c56; }
  .up.can em { color: var(--orange); }
  .up[aria-disabled="true"] { cursor: default; }
  .up[aria-disabled="true"]:not(.can) { opacity: .62; }
  .up.odd { border-style: dashed; }
  .up .tag { position: absolute; top: -8px; right: 7px; font: 11px var(--mono); padding: 0 5px; border-radius: 2px; background: var(--orange); color: var(--navy); }
  .up.new { animation: pulse 1.6s ease-in-out 4; }
  @keyframes pulse { 50% { box-shadow: 0 0 12px var(--orange); } }
  .up:focus-visible { outline: 2px dashed var(--orange); outline-offset: 2px; }
  #tip {
    position: fixed; z-index: 50; width: 238px; padding: 9px 12px; pointer-events: none; font: 14px/1.38 var(--hand); color: var(--navy);
    background: var(--cream); border-radius: 2px; box-shadow: 4px 4px 0 #ffaa5e88;
    background-image: linear-gradient(#0d2b4512 1px, transparent 1px), linear-gradient(90deg, #0d2b4512 1px, transparent 1px); background-size: 12px 12px;
  }
  #tip b { display: block; font: 400 16px var(--hand); color: var(--navy); border-bottom: 1.5px solid var(--rust); margin-bottom: 3px; }
  #tip small { display: block; margin-top: 5px; font: 12px var(--mono); color: var(--slate); }
  #tip.inline { position: static; width: auto; margin-top: 10px; }
  #tip i { display: block; margin-top: 6px; font-style: normal; font-size: 13px; color: var(--slate); border-top: 1.5px dashed #8d697a88; padding-top: 5px; }
  #bought { margin: 12px 0 2px; }
  #bought summary { display: flex; align-items: center; gap: 6px; font: 15px var(--hand); color: var(--peach); cursor: pointer; list-style: none;
                    padding: 4px 9px; border: 1.5px dashed #ffecd644; border-radius: 3px; }
  #bought summary::-webkit-details-marker { display: none; }
  #bought summary::before { content: "\25B8"; color: var(--orange); transition: transform .2s; }
  #bought[open] summary::before { transform: rotate(90deg); }
  #bought summary:focus-visible { outline: 2px dashed var(--orange); outline-offset: 2px; }
  .shelf { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .bought { max-width: 100%; font: 12px/1.2 var(--hand); color: var(--peach); background: #203c56; border: 1px solid #ffecd633; border-radius: 2px; padding: 4px 8px;
            cursor: help; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bought.odd { border-style: dashed; }
  .bought:hover, .bought.on { color: var(--cream); border-color: var(--orange); }
  .bought:focus-visible { outline: 2px dashed var(--orange); outline-offset: 2px; }
  #ending { margin: 24px auto 10px; max-width: 680px; text-align: center; padding: 20px 22px; }
  #ending h2 { font: 400 36px/1.1 var(--hand); margin: 0 0 10px; color: var(--cream); text-decoration: underline 2px var(--orange); text-underline-offset: 7px; }
  #ending p { margin: 8px 0; }
  #ending .stamp { display: inline-block; margin: 8px 0 12px; padding: 6px 14px; border: 2px solid var(--orange); color: var(--orange); font: 15px var(--mono); transform: rotate(-2deg); letter-spacing: 1px; }
  #ending .btn { text-align: center; }
  #shareBtn, #againBtn { margin: 4px; }
  @media (prefers-reduced-motion: reduce) { .up.new, .log.fresh, .btn.ring { animation: none; } .bar i, #bought summary::before { transition: none; } }
</style>

<body>

      <div class="stats">

        <button class="btn" id="duckBtn" type="button" hidden>🦆 Buy a duck<small id="duckSub"></small></button>

<script type="module">
import { createAudio, scale, midiToHz } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const DEBUG = location.search.includes('debug');
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:10:save';
let S = E.newState();
try { const raw = localStorage.getItem(KEY); if (raw) S = E.load(JSON.parse(raw)); } catch (e) {}
const save = () => { S.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { navy: '#0d2b45', deep: '#203c56', slate: '#544e68', mauve: '#8d697a', rust: '#d08159', orange: '#ffaa5e', peach: '#ffd4a3', cream: '#ffecd6' };
const HAND = "'Architects Daughter', cursive", MONO = "'Share Tech Mono', monospace";
const NOTE = E.NOTE;

// ---------- Sound ----------
// Everything on C whole tone (C D E F# G# A#), the soundtrack's scale. Honks are the other six.
const A = createAudio({ sfxTrim: 1, musicTrim: 7.4 });
const N = scale('whole tone', 60);
const hz = p => midiToHz(72 + p);
const sfx = {
  // The reed stretching: a tiny squeak at the current (continuous) pitch.
  stretch(p = 0) { A.tone({ type: 'triangle', freq: hz(p), dur: 0.05, vol: 0.05, cutoff: 2600 }); },
  squeak(n = 0) {
    A.tone({ type: 'square', freq: hz(n), dur: 0.09, vol: 0.06, cutoff: 2200, attack: 0.008 });
    A.tone({ type: 'triangle', freq: hz(n), dur: 0.16, vol: 0.16, attack: 0.01, at: A.now + 0.02 });
  },
  honk(n = 1) {
    A.tone({ type: 'sawtooth', freq: midiToHz(60 + n), dur: 0.2, vol: 0.07, cutoff: 900, attack: 0.02 });
    A.tone({ type: 'square', freq: midiToHz(48 + n), dur: 0.22, vol: 0.05, cutoff: 700, attack: 0.02 });
  },
  off() { A.tone({ type: 'triangle', freq: N(-2), dur: 0.08, vol: 0.12 }); A.tone({ type: 'triangle', freq: N(-3), dur: 0.14, vol: 0.1, at: A.now + 0.08 }); },
  slot(n = 0) { A.tone({ type: 'bell', freq: midiToHz(72 + n), dur: 0.12, vol: 0.09, at: A.now + 0.45 }); },
  rack() { A.tone({ type: 'pluck', freq: N(4), dur: 0.08, vol: 0.12, at: A.now + 0.45 }); },
  ready() { [0, 2, 4].forEach((d, i) => A.tone({ type: 'bell', freq: N(d + 6), dur: 0.2, vol: 0.08, at: A.now + 0.5 + i * 0.09 })); },
  // A finished prank plays its own little tune.
  prank(notes = [0, 4, 8]) {
    notes.slice(0, 16).forEach((n, i) => A.tone({ type: E.isHonk(n) ? 'triangle' : 'pluck', freq: midiToHz(72 + n), dur: 0.12, vol: 0.14, at: A.now + 0.05 + i * 0.13 }));
    const end = A.now + 0.12 + Math.min(16, notes.length) * 0.13;
    [0, 2, 4].forEach(d => A.tone({ type: 'keys', freq: N(d), dur: 0.5, vol: 0.06, at: end }));
  },
  buy() { [0, 2, 4].forEach((d, i) => A.tone({ type: 'keys', freq: N(d + 3), dur: 0.14, vol: 0.13, at: A.now + i * 0.065 })); },
  duck() { A.tone({ type: 'pluck', freq: N(5), dur: 0.08, vol: 0.12 }); A.tone({ type: 'pluck', freq: N(8), dur: 0.1, vol: 0.1, at: A.now + 0.06 }); },
  unlock() { A.tone({ type: 'bell', freq: N(8), dur: 0.3, vol: 0.08 }); A.tone({ type: 'bell', freq: N(10), dur: 0.35, vol: 0.07, at: A.now + 0.12 }); },
  deny() { A.tone({ type: 'triangle', freq: N(1), dur: 0.07, vol: 0.11 }); A.tone({ type: 'triangle', freq: N(0), dur: 0.11, vol: 0.1, at: A.now + 0.08 }); },
  bell() { A.tone({ type: 'bell', freq: N(9), dur: 0.25, vol: 0.06 }); A.tone({ type: 'bell', freq: N(9), dur: 0.3, vol: 0.05, at: A.now + 0.16 }); },
  answer() { A.tone({ type: 'keys', freq: N(4), dur: 0.12, vol: 0.1 }); A.tone({ type: 'keys', freq: N(2), dur: 0.2, vol: 0.08, at: A.now + 0.1 }); },
  coin() { A.tone({ type: 'bell', freq: N(12), dur: 0.05, vol: 0.04, cutoff: 3000 }); },
  wake() { A.tone({ type: 'pad', freq: N(-4), dur: 0.7, vol: 0.06, attack: 0.1 }); },
  matron() { A.tone({ type: 'keys', freq: N(-3), dur: 0.35, vol: 0.12 }); A.tone({ type: 'keys', freq: N(-6), dur: 0.5, vol: 0.11, at: A.now + 0.3 }); },
  flat() { A.tone({ type: 'triangle', freq: N(3), dur: 0.12, vol: 0.09 }); A.tone({ type: 'triangle', freq: midiToHz(65), dur: 0.22, vol: 0.08, at: A.now + 0.12 }); },

// ---------- Events ----------
function flyTo(kind, target, note, perfect) {
  fx.push({ kind: 'fly', from: [...FORK], to: target, t: 0, life: reduced ? 0.01 : 0.5, sprite: kind, note, perfect });
}
function pop(x, y, text, color = C.orange) { fx.push({ kind: 'text', x, y, text, color, t: 0, life: 1.4 }); }
let pendingTune = null;
function handle(out, ctx = {}) {
  for (const ev of out) {
    switch (ev.type) {
      case 'off': sfx.off(); pop(GX - 18, gy(ctx.pitch ?? 0), Math.abs(ev.d) > 0.4 ? 'between' : 'not quite', C.mauve);
        if (!S.honk && E.isHonk(ev.note) && S.review && Math.random() < 0.5) say('That one nearly did something odd. Between the lines, it sounded almost like a honk.');
        break;
      case 'discover':
        sfx.discover();
        say('HONK. That duck didn’t land on a line; it landed exactly between two, and honked. Not wrong, exactly. The other way right. There are six more notes on the gauge than Hoo drew.', 10);
        pop(GX - 30, 120, 'HONK!', C.orange);
        break;
      case 'slot': {
        const t = SLOT(ev.i, E.PLANS[S.plan]?.notes.length ?? 1);
        if (ev.fromRack) { fx.push({ kind: 'spark', x: t[0], y: t[1], t: 0, life: 0.6 }); break; }
        flyTo(E.isHonk(ev.note) ? 'honk' : 'duck', t, ev.note, ev.perfect);
        if (ctx.pitch != null) { (E.isHonk(ev.note) ? sfx.honk : sfx.squeak)(ev.note); sfx.slot(ev.note); }
        if (ev.perfect) pop(t[0], t[1] - 18, '★ dead on');
        break;
      }
      case 'rack': flyTo(E.isHonk(ev.note) ? 'honk' : 'duck', RACK(ev.note), ev.note);
        if (ctx.pitch != null) { (E.isHonk(ev.note) ? sfx.honk : sfx.squeak)(ev.note); sfx.rack(); pop(RACK(ev.note)[0], 158, 'spare ' + NOTE[ev.note]); }
        break;
      case 'repair': {
        if (!ev.fromRack) flyTo(E.isHonk(ev.note) ? 'honk' : 'duck', tabPos(ev.plan), ev.note);
        if (ctx.pitch != null) { (E.isHonk(ev.note) ? sfx.honk : sfx.squeak)(ev.note); sfx.repair(); }
        else if (!ev.fromRack) sfx.repair();
        pop(tabPos(ev.plan)[0], 368, 'retuned');
        break;
      }
      case 'ready': sfx.ready(); say(`Sheet ${ev.plan + 1} is full: every duck in place for ${E.PLANS[ev.plan].name.replace(/^The /, 'the ')}. Now it needs fitting: ${E.fitCost(S)}${E.fitCur(S) === 'p' ? 'p of tape and screws' : ' favours (somebody has to hold the ladder)'}.`); break;
      case 'prank': {
        const P = E.PLANS[ev.plan];
        sfx.prank(P.notes);
        let line = P.gag;
        if (ev.pence) line += ` (+${ev.pence}p in the lift by morning.)`;
        if (ev.favours) line += ` (+${ev.favours} favours.)`;
        say(line, 7);
        if (S.plan === E.PLANS.length) setTimeout(() => say('Every sheet is fitted. The hospital is one big, quiet instrument. Hoo looks at Bed 4, where Pip is asleep, and at the Gift Wrap, Just in Case.'), 9000);
        if (music) music.update();
        break;
      }
      case 'review':
        sfx.review();
        setTimeout(() => say('Matron Bramble, scarlet, cuts the Toy Fund to nothing and pulls the coin locks off every wheelchair. But the porters were at handover too. It was the funniest thing they’d seen all year, and they’d like to help. They pay in favours.', 12), 7200);
        deskTab = 'staff'; renderDesk(); if (music) music.update();
        break;
      case 'answer':
        sfx.answer();
        if (ev.pip) say(PIP[Math.min(PIP.length - 1, S.pipAsked - 1)], 6);
        else if (ev.gift) { say(pick([`Bed ${ev.bed} only wanted a sip of water, and hands Hoo a duck from their wash bag on the way back to sleep.`, `Bed ${ev.bed} rang to say there was a duck in their bed. There was. Hoo takes it for tuning.`, `Bed ${ev.bed} is half asleep and very generous. One duck, with thanks.`])); sfx.duck(); }
        else if (logT > 6) say(pick([`Bed ${ev.bed} needed their pillow turned to the cool side.`, `Bed ${ev.bed} wanted to know if owls sleep. Hoo says later.`, `Bed ${ev.bed} had a bad dream about a goose. Hoo sits with them until it goes.`, `Bed ${ev.bed} just wanted someone to say goodnight again.`]));
        break;
      case 'bell': sfx.bell(); break;
      case 'wake': sfx.wake(); say(`Nobody answered Bed ${ev.bed}. They’re awake now and singing. Hush ${'●'.repeat(Math.max(0, S.hush))}${'○'.repeat(E.HUSH_MAX - Math.max(0, S.hush))}.`); break;
      case 'matron': sfx.matron(); say('Matron Bramble’s office light goes on. She comes out to see who’s singing. Hoo hides the bench under a towel and takes everyone’s temperature, very slowly.'); if (music) music.update(); break;
      case 'matronEnd': say(pick(['Matron Bramble goes back to her office. The towel comes off the bench.', 'Matron Bramble’s door clicks shut. Hoo breathes out.'])); if (music) music.update(); break;
      case 'wheel': sfx.coin(); if (Math.random() < 0.08 && logT > 10) say('Hoo returns a wheelchair from the car park. The coin lock gives back its deposit with a satisfied clunk.'); break;
      case 'night': if (ev.fund) sfx.coin(); break;
      case 'lost': sfx.duck(); if (logT > 8) say(pick(['Lost property yields a duck in a sou’wester.', 'Lost property: one duck, slightly chewed, much loved.', 'A duck from lost property. Its tag says “PROPERTY OF DUCK”.'])); break;
      case 'autotune': if (ev.who === 'hoo' && logT > 12) say(`Hoo tunes a duck by feel: ${NOTE[ev.note]}. Close enough to count.`); break;
      case 'buyduck': break;
      case 'scrounge': break;
      case 'cover': break;
      case 'flat': sfx.flat(); if (logT > 6) say(`A duck in ${E.PLANS[ev.plan].name.replace(/^The /, 'the ')} has gone flat (♭). Old rubber. It wants a fresh ${NOTE[ev.note]}, and won’t make anyone smile until it gets one.`); break;
      case 'honkhint': say('The “?” slots on this sheet sit between the lines on the gauge, not on them. Hoo squints at the gauge, then at the duck.'); break;
    }
  }
}

// ---------- Shop ----------
const shop = $('shop');
const newUntil = {};
let shopSig = '';
const priceText = it => it.cur === 'p' ? `${it.cost}p` : `${it.cost} favours`;
function renderShop() {
  const all = S.plan >= 1 ? E.items(S).sort((a, b) => a.cost - b.cost) : [];
  for (const it of all) if (!S.seen.includes(it.id)) { S.seen.push(it.id); if (S.t > 2) sfx.unlock(); newUntil[it.id] = performance.now() + 9000; }
  $('shopHead').hidden = !all.length && !E.bought(S).length;
  const sig = all.map(i => i.id + ':' + i.cost + i.cur).join('|');
  if (sig !== shopSig) {
    shopSig = sig;
    shop.innerHTML = '';
    for (const it of all) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'up' + (it.kind === 'odd' ? ' odd' : '');
      b.dataset.id = it.id; b.dataset.cost = it.cost; b.dataset.cur = it.cur;
      b.innerHTML = '<b></b><em></em>';
      b.querySelector('b').textContent = it.name;
      b.querySelector('em').textContent = priceText(it) + (it.max > 1 ? ` · ${it.l}/${it.max}` : it.kind === 'staff' ? ` · ${S.staff}` : '');
      b.setAttribute('aria-describedby', 'tip');
      tipWire(b, () => upTip(it), () => { if (b.getAttribute('aria-disabled') !== 'true') doBuy(it.id); else sfx.deny(); });
      shop.append(b);
    }
  }
  const now = performance.now();
  let n = 0;
  for (const b of shop.querySelectorAll('button.up')) {
    const can = E.have(S, b.dataset.cur) >= Number(b.dataset.cost) && !S.ended;
    if (can) n++;
    b.setAttribute('aria-disabled', String(!can)); b.classList.toggle('can', can);
    const isNew = (newUntil[b.dataset.id] || 0) > now;
    b.classList.toggle('new', isNew);
    let tag = b.querySelector('.tag');
    if (isNew && !tag) { tag = document.createElement('i'); tag.className = 'tag'; tag.textContent = 'new'; tag.style.fontStyle = 'normal'; b.append(tag); }
    if (!isNew && tag) tag.remove();
  }
  $('afford').textContent = n ? `· ${n} affordable` : '';
  renderShelf();
}
function upTip(it) {
  let foot = it.cur === 'p' ? `${it.cost} pence` : `${it.cost} favours`;
  if (it.max > 1) foot += ` · level ${it.l} of ${it.max}`;
  if (it.kind === 'staff') foot += ` · ${S.staff} of ${E.MAX_STAFF} staff`;
  if (it.kind === 'odd') foot += ' · does very little';
  return { id: it.id, name: it.name, desc: it.desc, foot };
}
let tipFor = null, tipMoved = 0;
function tipWire(b, tipOf, act) {
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTip(b, tipOf()); });
  b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
  b.addEventListener('focus', () => { if (!b.dataset.touch) showTip(b, tipOf()); });
  b.addEventListener('blur', hideTip);
  b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
  // On touch the first tap shows what it does; the second does it.
  b.addEventListener('click', () => {
    const t = tipOf();
    if (b.dataset.touch && tipFor !== t.id) { showTip(b, t); return; }
    act();
  });
}
function showTip(b, it) {
  const tip = $('tip'); tipFor = it.id;
  tip.innerHTML = '<b></b><span></span><i></i><small></small>';
  tip.querySelector('b').textContent = it.name;
  tip.querySelector('span').textContent = it.desc;
  tip.querySelector('i').textContent = it.joke || ''; tip.querySelector('i').hidden = !it.joke;
  tip.querySelector('small').textContent = it.foot || ''; tip.querySelector('small').hidden = !it.foot;
  const inline = !!it.inline && innerWidth <= 760;
  tip.classList.toggle('inline', inline);
  if (!it.inline) for (const o of document.querySelectorAll('.bought.on')) o.classList.remove('on');
  if (inline) { if (tip.previousElementSibling !== $('shelf')) $('shelf').after(tip); } else if (tip.parentElement !== $('side')) { $('side').append(tip); tipMoved = performance.now(); }
  tip.hidden = false;
  if (inline) { tip.style.left = tip.style.top = ''; tip.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' }); return; }
  const r = b.getBoundingClientRect(), t = tip.getBoundingClientRect();
  if (r.left > t.width + 24 && innerWidth > 760) {
    const col = $('side').getBoundingClientRect();
    tip.style.left = `${col.left - t.width - 10}px`;
    tip.style.top = `${Math.max(8, Math.min(innerHeight - t.height - 8, r.top + r.height / 2 - t.height / 2))}px`;
  } else {
    tip.style.left = `${Math.max(8, Math.min(innerWidth - t.width - 8, r.left))}px`;
    tip.style.top = `${r.bottom + t.height + 14 < innerHeight ? r.bottom + 6 : r.top - t.height - 6}px`;
  }
}
function hideTip(force) {
  const tip = $('tip');
  if (tip.classList.contains('inline') && force !== true) return;
  tip.hidden = true; tip.classList.remove('inline'); tipFor = null;
  for (const b of document.querySelectorAll('.bought.on')) b.classList.remove('on');
}
addEventListener('scroll', () => { if (performance.now() - tipMoved > 400) hideTip(); }, true);
addEventListener('resize', () => { if (innerWidth > 760) hideTip(true); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.up, .tipped, .bought')) hideTip(); });

// The buttons at the top of the column explain themselves; on touch, the first tap of the session explains.
const ACTION_TIPS = {
  duckBtn: () => ({ id: 'duck', name: S.review ? 'Ask a porter for a duck' : 'Buy a duck', desc: S.review ? 'The gift shop won’t take pennies from Bramble Ward any more, but the porters know a man. One untuned duck for the bench.' : 'One untuned duck from the gift shop, for the bench. The Toy Fund is three pence a night, and so is a duck.', foot: `${E.stats(S).price} ${S.review ? 'favours' : 'pence'} · you have ${S.raw} to tune` }),
  fitBtn: () => ({ id: 'fit', name: `Fit ${E.plan(S)?.name || 'it'}`, desc: 'Every duck is in place on the sheet. Fitting them where they go takes tape, screws and somebody to hold the ladder. Then the prank goes off.', foot: `${E.fitCost(S)} ${E.fitCur(S) === 'p' ? 'pence' : 'favours'}` }),
  giveBtn: () => ({ id: 'give', name: 'Discharge morning', desc: `Unscrew every duck from every prank in the hospital, and every spare one, and give them all away to the children going home. It costs everything: all ${E.TOTAL_DUCKS} fitted ducks, every favour and every penny. This ends the game.`, foot: E.canGive(S) ? `Everything: ${E.TOTAL_DUCKS} ducks · ${S.favours} favours · ${S.pence}p` : `Needs at least ${E.GIVE_FAVOURS} favours (it takes them all) · you have ${S.favours}` }),
};
const explained = new Set();
for (const [id, tipOf] of Object.entries(ACTION_TIPS)) {
  const b = $(id); b.classList.add('tipped'); b.setAttribute('aria-describedby', 'tip');
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTip(b, tipOf()); });
  b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
  b.addEventListener('focus', () => { if (!b.dataset.touch) showTip(b, tipOf()); });
  b.addEventListener('blur', hideTip);
  b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
  b.addEventListener('click', e => {
    if (b.dataset.touch && !explained.has(id)) { explained.add(id); showTip(b, tipOf()); e.stopImmediatePropagation(); }
  }, { capture: true });
}
$('duckBtn').addEventListener('click', () => {
  const out = [];
  if (!E.buyDuck(S, out)) { sfx.deny(); return; }
  sfx.duck(); hud(); save();
  if (tipFor === 'duck') showTip($('duckBtn'), ACTION_TIPS.duckBtn());
});
$('fitBtn').addEventListener('click', () => {
  const out = [];
  if (!E.fit(S, out)) { sfx.deny(); return; }
  hideTip(); handle(out); hud(); renderShop(); save();
});
$('giveBtn').addEventListener('click', () => {
  if (!E.canGive(S)) { sfx.deny(); return; }
  hideTip(true); E.giveAway(S); end(false);
});

// ---------- The Bought shelf ----------
const shelfEl = $('bought');
const UI_KEY = window.DailyGame ? DailyGame.storageKey('ui') : 'di:10:ui';
let ui = {};
try { ui = JSON.parse(localStorage.getItem(UI_KEY) || '{}') || {}; } catch (e) {}
shelfEl.open = !!ui.bought;
const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) {} };

const shortName = n => n.replace(/^(The|A|An) /, '');
function boughtTip(it) {
  return { id: 'bought:' + it.id, name: it.name, desc: it.desc, joke: BUY_LINES[it.id] || '', foot: it.max > 1 ? `Bought · all ${it.max} levels` : it.kind === 'odd' ? 'Bought · did very little' : 'Bought', inline: true };
}
let shelfSig = null;
function renderShelf() {
  const list = S.ended ? [] : E.bought(S);
  const sig = list.map(i => i.id).join('|');
  if (sig === shelfSig) return;
  shelfSig = sig;
  shelfEl.hidden = !list.length;

    b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(); });
    b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
    b.addEventListener('focus', () => { if (!b.dataset.touch) show(); });
    b.addEventListener('blur', hideTip);
    b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
    b.addEventListener('click', () => { if (tipFor === 'bought:' + it.id && b.dataset.touch) hideTip(true); else show(); });

  }));
}
function doBuy(id) {
  const out = [];
  if (!E.buy(S, id, out)) { sfx.deny(); return; }
  delete newUntil[id];
  hideTip();
  if (id === 'recruit') {

}

// ---------- Clipboard and staff ----------
let deskTab = S.review ? 'staff' : 'clip';
$('tabClip').addEventListener('click', () => { deskTab = 'clip'; renderDesk(); });
$('tabStaff').addEventListener('click', () => { deskTab = 'staff'; renderDesk(); });
let deskSig = '';

  if (sig === deskSig) return;
  deskSig = sig;
  $('clipNote').textContent = `Hoo does the first ticked chore she can, top to bottom. She can remember ${st.lines} at once.`;

  visible.forEach((q, i) => {

    const [up, down] = r.querySelectorAll('.mini');
    up.disabled = i === 0; down.disabled = i === visible.length - 1;
    const move = d => { const a = S.queue.indexOf(q), other = visible[i + d], b = S.queue.indexOf(other); S.queue[a] = other; S.queue[b] = q; renderDesk(); save(); };
    up.addEventListener('click', () => move(-1)); down.addEventListener('click', () => move(1));
    const cb = r.querySelector('input'); cb.checked = !!q.on;
    cb.addEventListener('change', () => { q.on = cb.checked; renderDesk(); save(); });
    const param = r.querySelector('.param');
    const stepper = (label, key, step, min, max, unit) => {
      const minus = document.createElement('button'), plus = document.createElement('button'), v = document.createElement('span');
      minus.type = plus.type = 'button'; minus.className = plus.className = 'mini'; minus.textContent = '−'; plus.textContent = '+';

  });
  $('clipRows').replaceChildren(...rows);
  // Staff
  $('staffNote').textContent = `${S.staff} night staff · ${E.idle(S)} in the staff room. Everyone helps for favours.`;
  const jr = Object.entries(E.JOBS).map(([id, J]) => {
    const r = document.createElement('div'); r.className = 'row';

    g.fillStyle = flat ? C.orange : fitted ? C.cream : cur ? C.orange : '#ffecd666'; g.font = `9px ${MONO}`; g.textAlign = 'center';
    const short = P.name.replace(/^(The|Matron's) /, '').replace("Porters' ", '').replace('Pharmacy ', '').replace('Car Park ', '').replace('Linen ', '').replace('Fire ', '').replace('Dawn ', '').toUpperCase();
    g.fillText((flat ? '♭ ' : '') + short.slice(0, 8), cx, cy + 3); g.textAlign = 'left';
  }
}

// ---------- Loop ----------
let last = performance.now(), hudT = 0, saveT = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now; T += dt;
  if (!S.ended) {
    const out = []; E.step(S, dt, out); if (out.length) handle(out);
  }
  for (const f of fx) f.t += dt;
  for (let k = fx.length - 1; k >= 0; k--) if (fx[k].t > fx[k].life) fx.splice(k, 1);
  const mk = musicKey(); if (mk !== lastKey) { lastKey = mk; if (music) music.update(); }
  logT += dt; ambT += dt;
  if (pending && T >= holdT) { const m = pending; pending = null; say(m); }
  if (logT > 26 && ambT > 26 && !S.ended) {
    ambT = 0;
    const pool = S.review && Math.random() < 0.3 ? MATRON_LINES : AMBIENT;
    say(pick(pool));
  }
  hudT += dt; if (hudT > 0.2) { hudT = 0; hud(); renderShop(); renderDesk(); deskStatus(); }
  saveT += dt; if (saveT > 4) { saveT = 0; save(); }
  fit(); draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

function end(resumed) {
  S.ended = true; save();
  $('ending').hidden = false; $('desk').hidden = true; document.querySelector('.stats').hidden = true; $('shopHead').hidden = true; $('shop').hidden = true;
  const g0 = S.given || { ducks: E.TOTAL_DUCKS, favours: 0, pence: 0 };
  const h = Math.floor(S.t / 3600), m = Math.floor(S.t / 60) % 60;
  const time = h ? `${h}h${String(m).padStart(2, '0')}m` : `${m}m`;
  $('endText').textContent = `At seven o’clock on discharge morning, Nurse Hoo went round the whole hospital with a screwdriver. The ward door, the tea trolley, the lift, the stairs, Matron’s office: every duck came out. Each one got a name tag, a square of gift wrap and a curl of ribbon, and went home in somebody’s coat pocket, tuned to their favourite note. Pip got the first one, an E. The hospital went quiet again, all at once. Matron Bramble stood in the empty ward for a while, humming the polka.`;
  $('endStats').textContent = S.t > 1 ? `${time} · ${S.night} nights · ${g0.ducks} ducks, ${g0.favours} favours and ${g0.pence}p: everything, given away` : '';
  hud(); renderShop();
  if (music) music.update();
  if (!resumed) {
    sfx.finale();
    say('Somewhere across town, at bath time, a duck squeaks an E. Then another one, a G♯. Then the whole town, very slightly in tune.');
    if (window.DailyGame) DailyGame.finish({ lines: [`🦆 ${g0.ducks} ducks tuned, then given away`, `⏱ ${time} · 🌙 ${S.night} nights`, '🪗 a polka on 3p a night'] });
  }
  setTimeout(() => $('ending').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }), resumed ? 0 : 1500);
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Start ----------
try { await Promise.all([document.fonts.load(`14px ${HAND}`), document.fonts.load(`12px ${MONO}`)]); } catch (e) {}
await makeSprites();
bgCache = background();
if (Sprites.sheetRequested()) Sprites.showSheet();
fit();
if (S.ended) { end(true); say('The ward is empty and tidy, every bed made. Matron Bramble is humming something with a tuba in it.'); }
else {
  // While you were away: the clipboard and the staff kept going, gently, and the ward slept through.
  const away = S.lastSeen ? (Date.now() - S.lastSeen) / 1000 : 0;
  const got = S.t > 5 ? E.offline(S, away) : null;
  if (got && (got.pence || got.favours || got.installed || got.raw)) {
    const hrs = away / 3600, t = hrs >= 1 ? `${hrs.toFixed(1)} hours` : `${Math.round(away / 60)} minutes`;
    const bits = [got.pence > 0 && `${got.pence}p`, got.favours > 0 && `${got.favours} favours`, got.installed > 0 && `${got.installed} ducks fitted`, got.raw > 0 && `${got.raw} ducks to tune`, got.pranks > 0 && `${got.pranks} prank${got.pranks > 1 ? 's' : ''} finished`].filter(Boolean);
    say(`You were away ${t}${away > E.OFFLINE_CAP ? ' (Hoo only counts the first three)' : ''}. The ward slept through. Hoo kept to her clipboard${S.review ? ' and the night staff kept at it' : ''}: ${bits.join(', ')}.`);
  } else say(S.t > 5 ? 'Bramble Ward, still night. Hoo straightens her cap.' : 'Bramble Ward, 2am. Nurse Hoo has two ducks and a plan. Drag back from the duck on the bench, listen to it squeak higher, and let go on a glowing line.');
}
if (DEBUG) Object.assign(window.__game, { hud, renderShop });
hud(); renderShop(); renderDesk();
requestAnimationFrame(frame);
</script>
