<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAME TITLE · Daily Incremental</title>
<meta name="description" content="ONE-LINE TAGLINE. Daily Incremental.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Each game picks its own look. Keep the 16px side gutter and the safe-area padding. */
  :root { --bg: #111; --ink: #eee; --accent: #fc6; color-scheme: dark; }
  html, body { background: var(--bg); color: var(--ink); }
  /* Keep this: any display rule (flex, grid) would otherwise override the hidden attribute. */
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 15px/1.45 system-ui, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(14px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  /* Play area on the left, upgrades on the right; stacks on phones. */
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } }
  canvas { touch-action: none; }
</style>
<!-- Libraries from /shared/lib/libs.json, by version. List only what this game imports: the credits tool reads these. -->
<script type="importmap">
{ "imports": {
  "pixi.js": "/shared/lib/pixi.js@8.22.0/pixi.min.mjs"
} }
</script>
<!-- Shared site runtime: top bar, credits, share card, streaks. Set data-day to this game's "n" from games.json (an internal id, never shown). -->
<script src="/shared/daily.js" data-day="N" data-credits></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GAME TITLE</h1>
    <button id="soundBtn" type="button"></button>
    <button id="musicBtn" type="button"></button>
  </header>
  <div class="game">
    <main><canvas id="stage"></canvas><!-- log line, stats --></main>
    <aside id="side"><h2>Upgrades <span id="afford"></span></h2><div id="shop"><!-- one <button> per upgrade --></div></aside>
  </div>
  <section id="ending" hidden>
    <h2>The ending.</h2>
    <button id="shareBtn" type="button">Share result</button>
  </section>
</div>
<script type="module">
import { createAudio, scale, loop } from '/shared/kit/audio.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';

const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:N:save';
let S = { n: 0, time: 0, ended: false };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const A = createAudio();
A.bindToggles(document.getElementById('soundBtn'), document.getElementById('musicBtn'));

// Sprites: make them all up front (Sprites.register each one), then:
if (Sprites.sheetRequested()) Sprites.showSheet();

function end(resumed) {
  S.ended = true; save();
  document.getElementById('ending').hidden = false;
  if (!resumed && window.DailyGame) {
    DailyGame.finish({ lines: [`⏱ ${Math.floor(S.time / 60)}m${String(Math.floor(S.time % 60)).padStart(2, '0')}s`, `✨ ${S.n} things`] });
  }
}
document.getElementById('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());
if (S.ended) end(true);
</script>
</body>
</html>
