<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAME TITLE · Daily Incremental</title>
<meta name="description" content="ONE-LINE TAGLINE. Daily Incremental.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Each game picks its own look. Keep the 16px side gutter and the safe-area padding. */
  :root { --bg: #111; --ink: #eee; --accent: #fc6; color-scheme: dark; }
  html, body { background: var(--bg); color: var(--ink); }
  /* Keep this: any display rule (flex, grid) would otherwise override the hidden attribute. */
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 15px/1.45 system-ui, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(14px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  /* Play area on the left, upgrades on the right; stacks on phones. */
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } }
  canvas { touch-action: none; }
</style>
<!-- Libraries from /shared/lib/libs.json, by version. List only what this game imports: the credits tool reads these.
     Strudel's soundfonts import @strudel/core and @strudel/webaudio, which are both inside the @strudel/web bundle. -->
<script type="importmap">
{ "imports": {
  "@strudel/web": "/shared/lib/@strudel/web@1.3.0/index.mjs",
  "@strudel/core": "/shared/lib/@strudel/web@1.3.0/index.mjs",
  "@strudel/webaudio": "/shared/lib/@strudel/web@1.3.0/index.mjs",
  "@strudel/soundfonts": "/shared/lib/@strudel/soundfonts@1.3.0/index.mjs"
} }
</script>
<!-- Shared site runtime: top bar, credits, share card, streaks. Set data-day to this game's "n" from games.json (an internal id, never shown). -->
<script src="/shared/daily.js" data-day="N" data-credits></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GAME TITLE</h1>
  </header>
  <div class="game">
    <main><canvas id="stage"></canvas><!-- log line, stats --></main>
    <aside id="side"><h2>Upgrades <span id="afford"></span></h2><div id="shop"><!-- one <button> per upgrade --></div></aside>
  </div>
  <section id="ending" hidden>
    <h2>The ending.</h2>
    <button id="shareBtn" type="button">Share result</button>
  </section>
</div>
<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
// Copy the selected slopwave revision's module here before running the new game.
// Compose from this game's brief; see docs/music.md. Research stays in .slopwave/.
import { createPattern, cps } from './song.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';

const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:N:save';
let S = { n: 0, time: 0, ended: false };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// Volume comes from the site's Sound panel. Trims balance this game's mix: measure, then set.
const A = createAudio({ sfxTrim: 1, musicTrim: 1 });

// Sound effects, one function each. npm run mix plays them all through ?debug to balance the mix.
const sfx = {
  action() { A.tone({ type: 'pluck', freq: scale('major pentatonic', 60)(4), dur: 0.1, vol: 0.2 }); },
};
if (location.search.includes('debug')) window.__game = { A, sfx, long: [] };

// The game owns playback; song.mjs only creates a pattern. Use its exported cps.
// The composition can span many four-beat Strudel cycles.
// For phases, select a stable key/pattern here and call music.update() on changes.
let music = null;
function song() {
  return ['main', createPattern(music.strudel), cps];
}
createMusic(A, { song }).then(m => { music = m; music.update(); });

// Sprites: make them all up front (Sprites.register each one), then:
if (Sprites.sheetRequested()) Sprites.showSheet();

function end(resumed) {
  S.ended = true; save();
  document.getElementById('ending').hidden = false;
  if (!resumed && window.DailyGame) {
    DailyGame.finish({ lines: [`⏱ ${Math.floor(S.time / 60)}m${String(Math.floor(S.time % 60)).padStart(2, '0')}s`, `✨ ${S.n} things`] });
  }
}
document.getElementById('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());
if (S.ended) end(true);
</script>
</body>
</html>
